name: desktop-ci

# AEGIS (src/desktop) CI — separate from the main `ci` workflow since it only
# needs to run when the desktop shell (Tauri Rust host + TS/vitest UI)
# actually changes. `rust` checks the Cargo.toml compiles on both platforms
# it targets (Linux + Windows); `ts` checks the webview UI typechecks and
# its unit tests pass.

on:
  push:
    paths:
      - "src/desktop/**"
  pull_request:
    paths:
      - "src/desktop/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust / cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri

      # tauri-build reads `frontendDist: ../dist` at compile time and fails
      # if it's missing. `beforeBuildCommand` only runs under `tauri build`,
      # not `cargo check`, so build the webview UI here first (both OSes).
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json

      - name: Build webview UI (produces src/desktop/dist)
        working-directory: src/desktop
        run: |
          npm ci
          npm run build

      - name: System packages (Tauri Linux build deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev

      - name: cargo check
        run: cargo check --manifest-path src/desktop/src-tauri/Cargo.toml

      - name: cargo check (layer-shell feature)
        if: runner.os == 'Linux'
        run: cargo check --manifest-path src/desktop/src-tauri/Cargo.toml --features layer-shell

  ts:
    name: ts / typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json

      - name: Install desktop deps
        working-directory: src/desktop
        run: npm ci

      - name: Typecheck
        working-directory: src/desktop
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: src/desktop
        run: npx vitest run
