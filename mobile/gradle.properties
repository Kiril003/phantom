# PHANTOM Companion — Gradle properties.
#
# Memory: this Radxa Dragon Q6A has ~5 GB free RAM during development. The
# Kotlin daemon plus AGP can easily blow past 2 GB; we cap heap so the OOM
# killer never hits the build mid-Compose-compile.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC

# AndroidX migration is non-negotiable for Compose.
android.useAndroidX=true
# Kotlin code-style for AndroidX-compat.
kotlin.code.style=official
# Cut R-class bloat — the app uses ~20 IDs total, transitive R classes are wasteful.
android.nonTransitiveRClass=true
# Parallel modules + caching keep incremental builds tolerable on aarch64.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Ubuntu's android-sdk-build-tools ships an aarch64-native aapt2 binary;
# we override AGP's bundled x86_64-only one with that path so the build
# even gets to the link step on this host. Path is stable on Ubuntu Noble.
android.aapt2FromMavenOverride=/usr/lib/android-sdk/build-tools/debian/aapt2
# Don't try to stream artifacts the host can't run.
android.injected.testOnly=false
