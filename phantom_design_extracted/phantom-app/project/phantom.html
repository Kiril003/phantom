<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PHANTOM Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --display: 'Manrope', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --serif: 'Playfair Display', serif;
  }
  html, body { margin: 0; padding: 0; font-family: var(--display); }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 18% 10%, #fff5e2 0%, transparent 60%),
      radial-gradient(1100px 700px at 82% 90%, #ffe9d0 0%, transparent 60%),
      #f6f1e8;
    color: #1c160d;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  /* hide scrollbars inside artboards */
  .ph-scroll::-webkit-scrollbar { display: none; }
  .ph-scroll { scrollbar-width: none; }

  /* Canvas header */
  .canvas-header {
    position: fixed;
    top: 18px; left: 22px;
    z-index: 5;
    pointer-events: none;
    max-width: 520px;
  }
  .canvas-header .eyebrow {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 11px;
    color: #9a8a6f;
  }
  .canvas-header .title {
    font-weight: 700;
    font-size: 28px;
    margin-top: 6px;
    letter-spacing: -0.01em;
    color: #2a1f10;
  }
  .canvas-header .title em {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    color: #b07a10;
  }
  .canvas-header .desc {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: #6a5a44;
    max-width: 420px;
  }
</style>
</head>
<body>

<div class="canvas-header">
  <div class="eyebrow">PHANTOM · COMPANION</div>
  <div class="title">A familiar that <em>breathes with you</em></div>
  <div class="desc">Six core surfaces in two themes. State-accent shifts color, motion, and opacity. Drag to pan, scroll to zoom, click any artboard to focus.</div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="phantom-bundle.jsx"></script>

</body>
</html>
