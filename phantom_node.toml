# new hand appends here; nothing is advertised before it is wired end-to-end
# (Laws 1 & 2). Served Ed25519-signed at GET /node/manifest. The private key
# lives under .phantom-data/identity (gitignored) — never in the repo.

[node]
name = "Кузня"            # the Forge — muscle & long horizon
role = "forge"            # peer role in the two-body organism (phone = "companion")
platform = "linux-arm64"  # Radxa Dragon Q6A
schema = 1

[capabilities]
# real at F0 — usable today, backed by a live service or endpoint
shell = true          # linux/executor + dangerous_patterns (routes_linux)
voice = true          # STT (faster-whisper → vosk) + TTS (StyleTTS2/piper)
vision_screen = true  # vision/screen_capture + screen_ocr
always_on = true      # persistent daemon on mains power
disk = true           # local persistent storage

