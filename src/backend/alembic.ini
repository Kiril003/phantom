# PHANTOM OS — Alembic configuration (rebuild P1: real migrations).
#
# Runtime never reads this file directly — db/database.py builds the
# Config programmatically (script_location + sqlalchemy.url from the app
# config) so packaged installs work from any CWD. This file exists for
# developer CLI use:
#
#   cd src/backend
#   .venv/bin/alembic revision --autogenerate -m "add_x_column"
#   .venv/bin/alembic upgrade head
#
# The URL below is a placeholder — env.py overrides it with
# config.database_url at run time.

[alembic]
script_location = db/alembic
sqlalchemy.url = sqlite+aiosqlite:///.phantom-data/sqlite/phantom.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
