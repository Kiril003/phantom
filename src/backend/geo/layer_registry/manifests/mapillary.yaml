id: mapillary
name_ua: Mapillary (street imagery)
name_en: Mapillary street imagery
category: reference
license: CC-BY-SA (Mapillary contributors)
attribution: "Mapillary contributors"
source:
  type: rest_polling
  url: https://graph.mapillary.com/images
  auth:
    kind: api_key
    env_key: MAPILLARY_TOKEN
    query_param: access_token
  poll_interval_s: 1800
  ttl_s: 1800
  bbox_required: true
  rate_limit_per_minute: 60
geometry: point
style:
  fill: accent/electric
  fill_opacity: 0.6
  point_radius: 3
  icon: camera
agent_verbs:
  - map.inspect_feature
require_internet: true
require_setting: layers.mapillary.enabled
private: false
priority: background
default_active: false
available_offline: false
tags:
  - photo
  - reference
