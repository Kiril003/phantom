[package]
name = "aegis-film"
version = "0.1.0"
edition = "2021"
description = "AEGIS Stratum 0 — the Film: PHANTOM's optical membrane over the host OS"
license = "UNLICENSED"
# Not published to crates.io. (The "UNLICENSED" EULA naming is an owner
# decision, left as-is here — this flag is unrelated to that choice.)
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback-only HTTP to the co-located backend; no TLS backend pulled in.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"], optional = true }
# Pure-Rust XCB — no libxcb link, the Conduit hook talks the X protocol direct.
x11rb = { version = "0.13", features = ["xkb"] }
# Wayland Conduit Tier 3: a compositor keybind runs `aegis --summon`, which
# this plugin forwards to the already-running instance to toggle the Breath
# Line (see conduit/wayland.rs). Linux-only — the summon-IPC need is Wayland's;
# scoping it here keeps the Windows/macOS builds untouched. Tauri-org plugin,
# MIT/Apache-2.0.
tauri-plugin-single-instance = "2"

# Union of the two Windows dependency blocks that used to exist here (one
# keyed on `target_os = "windows"`, one on `windows` — both matched the same
# target and both declared `windows` with different feature sets, so only
# one ever "won" depending on resolution order). x11rb was also erroneously
# listed under this target; X11 doesn't exist on Windows, so it's gone —
# the linux target above is the only place it belongs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[features]
default = []
# Wayland wlr-layer-shell path (sway/hyprland/wlroots). X11 and Mutter fall
# back to the Dock-hint override path in overlay.rs.
layer-shell = ["dep:gtk-layer-shell"]

# The board is RAM-starved; debuginfo is the single biggest build-memory cost.
[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
