<!DOCTYPE html>
<html lang="uk" data-state="SHADOW" data-theme="sunrise-warm">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/phantom-icon.svg" />
    <meta name="viewport" content="width=1024, initial-scale=1.0" />
    <meta name="theme-color" content="#fdf6e9" />
    <title>PHANTOM OS</title>
    <!-- Text fonts (Manrope, Playfair Display, Space Grotesk, JetBrains Mono)
         are self-hosted via @fontsource, imported in src/main.tsx — no CDN.
         Material Symbols is still CDN-loaded below until the msym→lucide
         icon sweep removes the last ligature spans; do NOT drop this link
         before that or those spans render literal English words. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..700,0..1,-50..200"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        overflow: hidden;
        background: #fdf6e9;
        color: #1a1612;
        font-family: 'Manrope', 'Space Grotesk', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
