<!--
  PHANTOM OS desktop shell splash gate.

  Per ADR-DSH-001: the splash page polls /readyz; once 200 OK the WebView
  navigates to the React bundle (loaded via `frontendDist` in
  tauri.conf.json — `../dist/index.html`). The black-screen budget is
  ≤ 2.5 s on Q6A cold boot (G1+G2 lifespan ≤ 2 s + 500 ms WebView init).

  Keep this file static — no framework, no build step. The Rust shell hosts
  it from the bundle resources directly.
-->
<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>PHANTOM OS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #050505;
        color: #e6e6e6;
        font-family:
          'JetBrains Mono', 'Inter', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .frame {
        text-align: center;
        max-width: 480px;
      }
      .glyph {
        font-size: 48px;
        letter-spacing: 0.5em;
        margin-bottom: 32px;
        opacity: 0;
        animation: glyph-rise 1.2s ease forwards;
      }
      .status {
        font-size: 13px;
        opacity: 0.7;
        height: 18px;
        letter-spacing: 0.05em;
      }
      .pulse {
        margin-top: 24px;
        width: 240px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          #4ad,
          transparent
        );
        animation: pulse-flow 1.6s linear infinite;
      }
      @keyframes glyph-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse-flow {
        0% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="glyph">PHANTOM</div>
      <div class="status" id="status">starting…</div>
      <div class="pulse"></div>
    </div>
    <script>
      const STATUS_EL = document.getElementById('status');
      const READYZ = 'http://127.0.0.1:8000/readyz';
      const TARGET = '../dist/index.html';
      const POLL_MS = 250;
      const MAX_WAIT_MS = 30000;
      const t0 = performance.now();

      async function pollOnce() {
        try {
          const r = await fetch(READYZ, { cache: 'no-store' });
          if (r.ok) {
            STATUS_EL.textContent = 'online';
            window.location.replace(TARGET);
            return true;
          }
        } catch (_) {
          /* sidecar still booting; ignore */
        }
        return false;
      }

      async function loop() {
        while (performance.now() - t0 < MAX_WAIT_MS) {
          if (await pollOnce()) return;
          STATUS_EL.textContent = `warming  ${Math.floor(
            (performance.now() - t0) / 1000,
          )}s`;
          await new Promise((res) => setTimeout(res, POLL_MS));
        }
        STATUS_EL.textContent =
          'backend did not become ready within 30s — see logs';
      }

      loop();
    </script>
  </body>
</html>
